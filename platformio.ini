; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; This branch (c3-mini) targets the ESP32-C3 SuperMini instead of the classic ESP32 board the
; main branch is built for - no OLED/encoder, WiFi web interface only. See src/src.ino's header
; comment for the pin table and what was removed.

[env:esp32-c3-supermini]
;Espressif 32 platform ------------------------------------------------------------------------------------
platform = espressif32@6.1.0 ;force to use platform v6.1.0, same as the classic-board env

;Arduino framework ----------------------------------------------------------------------------------------
framework = arduino

; ESP32-C3 board --------------------------------------------------------------------------------------------
; The SuperMini is a generic third-party C3 module board with no dedicated PlatformIO board
; definition - esp32-c3-devkitm-1 (same chip/module family, 4MB flash) is the closest match and
; needs no overrides.
board = esp32-c3-devkitm-1
monitor_speed   = 115200
upload_protocol = esptool
monitor_filters = esp32_exception_decoder ; This option will show more informations in case of a backtrace!

build_flags =
  ;-DCORE_DEBUG_LEVEL=5 ; 0= none, 1= error, 2= warn, 3= info, 4= debug, 5= verbose
  ; The SuperMini has no separate USB-UART bridge chip like the classic ESP32 board does - the
  ; USB port talks directly to the C3's native USB-CDC peripheral. Without these two flags,
  ; Serial silently stays on UART0 (GPIO20/21, unconnected to anything), so usbJoystickLoop()'s
  ; PosJ/GETVERSION/etc. commands sent over the USB cable would never reach the firmware at all.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; These libraries are required and downloaded automatically (requires https://git-scm.com/downloads ) ----
lib_deps =
    https://github.com/Links2004/arduinoWebSockets/archive/refs/tags/2.4.1.tar.gz
